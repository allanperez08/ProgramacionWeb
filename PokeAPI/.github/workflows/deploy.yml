name: Deploy Pokémon App

on:
  push:
    branches:
      - assessment-1  # tu rama de entrega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Setup Doppler
      uses: dopplerhq/cli-action@v3
      with:
        token: ${{ secrets.DOPPLER_TOKEN }}
        project: assessment-1   # <-- nombre de tu proyecto Doppler
        config: production      # <-- entorno de Doppler

    - name: Export Doppler secrets
       run: |
       eval $(doppler secrets download --no-file --format env)

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 8️⃣ Subir la carpeta dist/ al bucket S3
    - name: Upload dist to S3
      run: |
        aws s3 sync dist/ s3://$S3_BUCKET --delete

    # 9️⃣ Invalidar la caché de CloudFront para reflejar cambios inmediatamente
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
