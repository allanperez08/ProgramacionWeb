<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook - Inicia sesión o regístrate</title>
  </head>
  <body>
    <main class="container">
      <section class="left">
        <h1>facebook</h1>
        <p>Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
      </section>

      <section class="right">
        <form class="login-form">
          <input type="text" id="email" name="email" placeholder="Correo electrónico o número de teléfono" required>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>

          <button type="submit" class="login-btn">Iniciar sesión</button>

          <a href="#" class="forgot-password">¿Has olvidado la contraseña?</a>
          <hr />
          <button type="button" class="create-account-btn">Crear cuenta nueva</button>
        </form>
        <p class="create-page"><a href="#">Crea una página</a> para una celebridad, una marca o un negocio.</p>
      </section>
