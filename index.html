<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Facebook - inicia sesión o regístrate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="info">
            <h1>facebook</h1>
            <p>Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
        </section>
        <section class="login-form">
            <form>
                <input type="text" id="email" name="email" placeholder="Correo electrónico o número de teléfono" required>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar sesión</button>
                <a href="#">¿Has olvidado tu contraseña?</a>
                <hr>
                <button class="register">Crear cuenta nueva</button>
            </form>
        </section>
    </main>
</body>
</html>
